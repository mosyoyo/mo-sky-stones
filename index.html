<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>光遇日历订阅</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,.96) 0, rgba(255,255,255,.42) 34%, rgba(245,245,247,0) 62%),
        #f5f5f7;
    }
    main { max-width: 920px; margin: 0 auto; padding: 72px 20px 44px; }
    .hero { text-align: center; margin: 0 auto 34px; max-width: 720px; }
    .eyebrow { color: #6e6e73; font-size: 15px; margin: 0 0 12px; }
    h1 { font-size: clamp(40px, 7vw, 72px); line-height: 1.02; letter-spacing: 0; margin: 0; font-weight: 700; }
    .lead { color: #515154; font-size: 19px; line-height: 1.55; margin: 18px auto 0; max-width: 620px; }
    section {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 22px 60px rgba(0,0,0,.08);
      backdrop-filter: blur(18px);
    }
    .group { display: grid; gap: 14px; margin-bottom: 18px; }
    .group h2 { margin: 0; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 13px 15px;
      background: #f5f5f7;
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 16px;
      font-size: 15px;
      color: #1d1d1f;
    }
    .mode label { justify-content: space-between; }
    input[type="checkbox"], input[type="radio"] { width: 19px; height: 19px; accent-color: #0071e3; }
    input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 16px;
      background: #fff;
      color: #1d1d1f;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      min-height: 210px;
      padding: 14px 16px;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 16px;
      background: #fff;
      color: #1d1d1f;
      font-size: 13px;
      line-height: 1.55;
      resize: vertical;
    }
    .row { display: flex; gap: 10px; margin-top: 16px; }
    button, a.button {
      border: 0;
      background: #0071e3;
      color: #fff;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .ghost { background: #e8f2ff; color: #0066cc; }
    .muted { color: #6e6e73; font-size: 14px; line-height: 1.7; margin: 18px 0 0; }
    .linkbox { display: grid; gap: 10px; }
    .tiny { color: #6e6e73; font-size: 13px; }
    @media (max-width: 640px) {
      main { padding-top: 48px; }
      section { border-radius: 22px; padding: 18px; }
      .row { flex-direction: column; }
      button, a.button { text-align: center; }
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <p class="eyebrow">Sky: Children of the Light</p>
      <h1>光遇日历订阅</h1>
      <p class="lead">选择想关注的内容，生成一个干净的 iCalendar 订阅链接。</p>
    </div>
    <section>
      <div class="group">
        <h2>订阅内容</h2>
        <div class="grid">
          <label><input type="checkbox" value="red" checked>红石</label>
          <label><input type="checkbox" value="black" checked>黑石</label>
          <label><input type="checkbox" value="traveling_spirit">旅行先祖</label>
          <label><input type="checkbox" value="season">季节</label>
          <label><input type="checkbox" value="activity">活动</label>
          <label><input type="checkbox" value="bonus">双倍活动</label>
          <label><input type="checkbox" value="maintenance">维护更新</label>
        </div>
      </div>
      <div class="group mode">
        <h2>活动模式</h2>
        <label><span>两者都要</span><input type="radio" name="eventMode" value="all" checked></label>
        <label><span>只要连续事件</span><input type="radio" name="eventMode" value="range"></label>
        <label><span>只要结束提醒</span><input type="radio" name="eventMode" value="end"></label>
      </div>
      <div class="linkbox">
        <input id="url" type="text" readonly>
        <div class="row">
          <button id="copy">复制链接</button>
          <a id="open" class="button ghost" href="#">打开订阅</a>
        </div>
      </div>
      <p class="muted">红石和黑石默认开启；活动类内容会在后台审核后进入订阅。你可以先切换模式试一下，看看手机到底认哪一种。</p>
      <p class="tiny" id="preview"></p>
    </section>
    <section style="margin-top:18px">
      <div class="group">
        <h2>自定义 ICS 测试</h2>
        <textarea id="customIcs" spellcheck="false">BEGIN:VEVENT
UID:test-event@mo-sky-stones
DTSTAMP:20260616T000000Z
DTSTART:20260620T020000Z
DTEND:20260620T023000Z
SUMMARY:测试事件
DESCRIPTION:自定义ICS测试
LOCATION:测试
CATEGORIES:测试
STATUS:CONFIRMED
TRANSP:OPAQUE
END:VEVENT</textarea>
      </div>
      <div class="linkbox">
        <input id="customUrl" type="text" readonly>
        <div class="row">
          <button id="copyCustom">复制自定义链接</button>
          <a id="openCustom" class="button ghost" href="#">打开自定义订阅</a>
        </div>
      </div>
      <p class="muted">这里可以只写 VEVENT，也可以粘完整 VCALENDAR。链接会把内容放进 URL，适合临时测试，不适合放很长文本。</p>
    </section>
  </main>
  <script>
    const checks = [...document.querySelectorAll('input[type="checkbox"]')];
    const modes = [...document.querySelectorAll('input[name="eventMode"]')];
    const url = document.querySelector('#url');
    const openLink = document.querySelector('#open');
    const preview = document.querySelector('#preview');
    const customIcs = document.querySelector('#customIcs');
    const customUrl = document.querySelector('#customUrl');
    const openCustom = document.querySelector('#openCustom');
    function update() {
      const types = checks.filter(c => c.checked).map(c => c.value).join(',');
      const eventMode = modes.find(r => r.checked)?.value || 'all';
      const value = `${location.origin}/calendar.ics?types=${encodeURIComponent(types)}&eventMode=${encodeURIComponent(eventMode)}`;
      url.value = value;
      openLink.href = value;
      preview.textContent = eventMode === 'all'
        ? '当前模式：连续事件 + 结束提醒'
        : eventMode === 'range'
          ? '当前模式：只保留连续事件'
          : '当前模式：只保留结束提醒';
    }
    function updateCustom() {
      const value = `${location.origin}/custom.ics?data=${encodeURIComponent(customIcs.value.trim())}`;
      customUrl.value = value;
      openCustom.href = value;
    }
    checks.forEach(c => c.addEventListener('change', update));
    modes.forEach(r => r.addEventListener('change', update));
    document.querySelector('#copy').addEventListener('click', async () => navigator.clipboard.writeText(url.value));
    customIcs.addEventListener('input', updateCustom);
    document.querySelector('#copyCustom').addEventListener('click', async () => navigator.clipboard.writeText(customUrl.value));
    update();
    updateCustom();
  </script>
</body>
</html>
