<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sky-ics | 光遇日历订阅</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --card: rgba(255, 255, 255, .82);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --blue: #007aff;
      --blue-dark: #0066cc;
      --line: rgba(60, 60, 67, .16);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 55%, #efeff4 100%);
    }
    main {
      min-height: 100vh;
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 34px 18px 22px;
      display: grid;
      place-items: center;
    }
    .card {
      position: relative;
      width: 100%;
      min-height: min(680px, calc(100vh - 56px));
      display: grid;
      grid-template-rows: 1fr auto;
      padding: clamp(28px, 7vw, 64px) clamp(18px, 6vw, 52px) 22px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 34px;
      background: var(--card);
      box-shadow: 0 28px 80px rgba(0, 0, 0, .08);
      backdrop-filter: blur(22px);
    }
    .help-button {
      position: absolute;
      top: 18px;
      right: 18px;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, .7);
      color: var(--blue);
      text-decoration: none;
      font-size: 18px;
      font-weight: 780;
      line-height: 1;
    }
    .hero {
      align-self: center;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--blue-dark);
      font-size: 19px;
      font-weight: 760;
      letter-spacing: .1em;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 76px);
      line-height: .98;
      letter-spacing: 0;
      font-weight: 780;
    }
    .subtitle {
      margin: 16px auto 0;
      max-width: 430px;
      color: var(--muted);
      font-size: clamp(18px, 4vw, 24px);
      line-height: 1.35;
      font-weight: 500;
    }
    .actions {
      display: grid;
      justify-items: center;
      gap: 12px;
      margin-top: 38px;
    }
    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: min(320px, 100%);
      min-height: 58px;
      padding: 0 30px;
      border: 0;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 19px;
      font-weight: 720;
      cursor: pointer;
      box-shadow: 0 14px 34px rgba(0, 122, 255, .28);
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .primary:hover {
      transform: translateY(-1px);
      background: var(--blue-dark);
      box-shadow: 0 18px 40px rgba(0, 122, 255, .34);
    }
    .note {
      max-width: 460px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .platform-tip {
      display: none;
      width: min(460px, 100%);
      margin: 0;
      padding: 12px 14px;
      border: 1px solid rgba(0, 122, 255, .14);
      border-radius: 16px;
      background: rgba(232, 242, 255, .72);
      color: var(--text);
      text-align: left;
      font-size: 13px;
      line-height: 1.55;
    }
    body.is-apple .apple-tip,
    body.is-android .android-tip {
      display: block;
    }
    .platform-tip strong {
      font-weight: 720;
      color: var(--blue-dark);
    }
    .advanced {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255, 255, 255, .58);
      text-decoration: none;
      font-size: 13px;
      font-weight: 650;
    }
    .secondary-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }
    .secondary-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 28px;
      color: var(--muted);
      font-size: 12px;
    }
    .credit { margin-left: auto; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 16px);
      opacity: 0;
      width: min(420px, calc(100vw - 32px));
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(29, 29, 31, .92);
      color: #fff;
      text-align: center;
      font-size: 14px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .18);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    @media (max-width: 560px) {
      main { padding: 12px; }
      .card {
        min-height: calc(100vh - 24px);
        border-radius: 28px;
        padding: 34px 18px 16px;
      }
      .actions { margin-top: 30px; }
      .primary { width: 100%; min-height: 56px; font-size: 18px; }
      .advanced { width: 100%; }
      footer { align-items: center; }
      .eyebrow { font-size: 18px; }
    }
  </style>
  <script src="/analytics.js" defer></script>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <a class="help-button" href="/help" aria-label="使用帮助" title="使用帮助">?</a>
      <div class="hero">
        <p class="eyebrow">SKY CALENDAR</p>
        <h1 id="title">光遇日历订阅</h1>
        <p class="subtitle">你的天空王国日程。</p>
        <div class="actions">
          <button id="subscribe" class="primary" type="button">订阅光遇日历</button>
          <p class="note">一键订阅默认包含红石；复刻、季节、活动默认仅结束提醒；双倍、大蜡烛、维护保留全程提醒。</p>
          <p class="platform-tip apple-tip"><strong>首次订阅：</strong>添加后到系统日历列表，点订阅右侧蓝色 ⓘ，进入“订阅详细信息”，把“移除提醒”关掉。</p>
          <p class="platform-tip android-tip"><strong>首次订阅：</strong>按钮会复制链接，请粘贴到日历 App 的“订阅日历”或 URL 入口。</p>
          <p class="secondary-note">想自己选择内容，或者只关注指定先祖。</p>
          <div class="secondary-actions">
            <a class="advanced" href="/subscribe">自定义订阅</a>
            <a class="advanced" href="/spirits">指定先祖</a>
          </div>
        </div>
      </div>
      <footer>
        <span>© 2026 sky-ics</span>
        <span class="credit">by 喵喵</span>
        <span id="fallback"></span>
      </footer>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const host = 'sky-ics.pages.dev';
    const query = 'types=red,traveling_spirit,season,activity,bonus,candle_heap,maintenance&endOnly=traveling_spirit,season,activity';
    const httpsUrl = `https://${host}/calendar.ics?${query}`;
    const webcalUrl = `webcal://${host}/calendar.ics?${query}`;
    const toast = document.querySelector('#toast');
    const ua = navigator.userAgent || '';
    const isAppleMobile = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);

    document.body.classList.add(isAppleMobile ? 'is-apple' : isAndroid ? 'is-android' : 'is-other');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    async function copyLink() {
      try {
        await navigator.clipboard.writeText(httpsUrl);
        showToast('已复制订阅链接，请粘贴到日历 App。');
      } catch (_) {
        document.querySelector('#fallback').innerHTML = `<a href="${httpsUrl}">复制失败，点这里打开链接</a>`;
        showToast('浏览器不允许自动复制，可以点底部链接。');
      }
    }

    document.querySelector('#subscribe').addEventListener('click', async () => {
      if (isAppleMobile) {
        location.href = webcalUrl;
        return;
      }
      await copyLink();
    });
  </script>
</body>
</html>
