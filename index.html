<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>光遇日历订阅</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,.96) 0, rgba(255,255,255,.42) 34%, rgba(245,245,247,0) 62%),
        #f5f5f7;
    }
    main { max-width: 920px; margin: 0 auto; padding: 72px 20px 44px; }
    .hero { text-align: center; margin: 0 auto 34px; max-width: 720px; }
    .eyebrow { color: #6e6e73; font-size: 15px; margin: 0 0 12px; }
    h1 { font-size: clamp(40px, 7vw, 72px); line-height: 1.02; letter-spacing: 0; margin: 0; font-weight: 700; }
    .lead { color: #515154; font-size: 19px; line-height: 1.55; margin: 18px auto 0; max-width: 620px; }
    section {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 22px 60px rgba(0,0,0,.08);
      backdrop-filter: blur(18px);
    }
    .group { display: grid; gap: 14px; margin-bottom: 18px; }
    .group h2 { margin: 0; font-size: 16px; }
    .group h3 { margin: 8px 0 0; font-size: 14px; color: #515154; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 13px 15px;
      background: #f5f5f7;
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 16px;
      font-size: 15px;
      color: #1d1d1f;
    }
    .mode label { justify-content: space-between; }
    .master { background: #e8f2ff; border-color: rgba(0,113,227,.25); }
    input[type="checkbox"] { width: 19px; height: 19px; accent-color: #0071e3; }
    input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 16px;
      background: #fff;
      color: #1d1d1f;
      font-size: 14px;
    }
    .row { display: flex; gap: 10px; margin-top: 16px; }
    button, a.button {
      border: 0;
      background: #0071e3;
      color: #fff;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .ghost { background: #e8f2ff; color: #0066cc; }
    .muted { color: #6e6e73; font-size: 14px; line-height: 1.7; margin: 18px 0 0; }
    .linkbox { display: grid; gap: 10px; }
    .tiny { color: #6e6e73; font-size: 13px; }
    .divider { height: 1px; background: rgba(0,0,0,.08); margin: 6px 0; }
    @media (max-width: 640px) {
      main { padding-top: 48px; }
      section { border-radius: 22px; padding: 18px; }
      .row { flex-direction: column; }
      button, a.button { text-align: center; }
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <p class="eyebrow">Sky: Children of the Light</p>
      <h1>光遇日历订阅</h1>
      <p class="lead">选择想关注的内容，生成一个干净的 iCalendar 订阅链接。</p>
    </div>
    <section>
      <div class="group">
        <h2>订阅内容</h2>
        <div class="grid">
          <label><input type="checkbox" data-type="red" checked>红石</label>
          <label><input type="checkbox" data-type="black" checked>黑石</label>
          <label><input type="checkbox" data-type="traveling_spirit">复刻先祖</label>
          <label><input type="checkbox" data-type="season">季节</label>
          <label><input type="checkbox" data-type="activity">活动</label>
          <label><input type="checkbox" data-type="bonus">双倍</label>
          <label><input type="checkbox" data-type="candle_heap">大蜡烛</label>
          <label><input type="checkbox" data-type="maintenance">维护</label>
        </div>
      </div>

      <div class="group mode">
        <h2>仅结束时提醒（排除范围事件）</h2>
        <label class="master">
          <span>全部应用（总开关）</span>
          <input type="checkbox" id="endOnlyMaster">
        </label>
        <div class="grid">
          <label><span>复刻先祖</span><input type="checkbox" data-endonly="traveling_spirit"></label>
          <label><span>活动</span><input type="checkbox" data-endonly="activity"></label>
          <label><span>季节</span><input type="checkbox" data-endonly="season"></label>
          <label><span>双倍</span><input type="checkbox" data-endonly="bonus"></label>
          <label><span>大蜡烛</span><input type="checkbox" data-endonly="candle_heap"></label>
        </div>
      </div>

      <div class="group mode">
        <h2>持续事件标记为全天</h2>
        <div class="grid">
          <label><span>复刻先祖</span><input type="checkbox" data-allday="traveling_spirit"></label>
          <label><span>活动</span><input type="checkbox" data-allday="activity"></label>
          <label><span>季节</span><input type="checkbox" data-allday="season"></label>
          <label><span>双倍</span><input type="checkbox" data-allday="bonus"></label>
          <label><span>大蜡烛</span><input type="checkbox" data-allday="candle_heap"></label>
          <label><span>维护</span><input type="checkbox" data-allday="maintenance"></label>
        </div>
      </div>

      <div class="linkbox">
        <input id="url" type="text" readonly>
        <div class="row">
          <button id="copy">复制链接</button>
          <a id="open" class="button ghost" href="#">打开订阅</a>
        </div>
      </div>
      <p class="muted">红石和黑石默认开启；活动类内容会在后台审核后进入订阅。仅结束时提醒会去掉范围事件，只留结束前 X 小时的提醒。勾选「全天」后该类型事件以全天格式输出。</p>
      <p class="tiny" id="preview"></p>
    </section>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => [...document.querySelectorAll(s)];
    const typeChecks = $$('input[data-type]');
    const endOnlyChecks = $$('input[data-endonly]');
    const allDayChecks = $$('input[data-allday]');
    const endOnlyMaster = $('#endOnlyMaster');
    const urlInput = $('#url');
    const openLink = $('#open');
    const preview = $('#preview');

    function getSelected(attr) {
      return $$(`input[data-${attr}]:checked`).map(c => c.getAttribute(`data-${attr}`));
    }

    function update() {
      const types = typeChecks.filter(c => c.checked).map(c => c.getAttribute('data-type'));
      const endOnly = getSelected('endonly');
      const allDay = getSelected('allday');
      const params = new URLSearchParams();
      params.set('types', types.join(','));
      if (endOnly.length) params.set('endOnly', endOnly.join(','));
      if (allDay.length) params.set('allDay', allDay.join(','));
      const value = `${location.origin}/calendar.ics?${params.toString()}`;
      urlInput.value = value;
      openLink.href = value;
      preview.textContent = `已选 ${types.length} 种类型 · 结束提醒 ${endOnly.length} 种 · 全天事件 ${allDay.length} 种`;
    }

    // 总开关联动
    function syncMaster() {
      const all = endOnlyChecks.length;
      const checked = endOnlyChecks.filter(c => c.checked).length;
      endOnlyMaster.checked = all > 0 && checked === all;
      endOnlyMaster.indeterminate = checked > 0 && checked < all;
    }

    endOnlyMaster.addEventListener('change', () => {
      endOnlyChecks.forEach(c => { c.checked = endOnlyMaster.checked; });
      syncMaster();
      update();
    });

    typeChecks.forEach(c => c.addEventListener('change', update));
    endOnlyChecks.forEach(c => c.addEventListener('change', () => { syncMaster(); update(); }));
    allDayChecks.forEach(c => c.addEventListener('change', update));
    $('#copy').addEventListener('click', async () => navigator.clipboard.writeText(urlInput.value));

    syncMaster();
    update();
  </script>
</body>
</html>
