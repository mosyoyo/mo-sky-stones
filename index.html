<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>光遇日历订阅</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --panel: rgba(255, 255, 255, .82);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, .08);
      --blue: #0071e3;
      --blue-soft: #e8f2ff;
      --shadow: 0 22px 60px rgba(0, 0, 0, .08);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -8%, rgba(255, 255, 255, .98) 0, rgba(255, 255, 255, .42) 34%, rgba(245, 245, 247, 0) 62%),
        linear-gradient(180deg, #fbfbfd 0%, var(--bg) 60%, #eeeeef 100%);
    }
    main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 64px 18px 42px;
    }
    .hero {
      max-width: 720px;
      margin: 0 auto 30px;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 15px;
    }
    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 70px);
      line-height: 1.04;
      letter-spacing: 0;
      font-weight: 740;
    }
    .lead {
      max-width: 620px;
      margin: 18px auto 0;
      color: #515154;
      font-size: 18px;
      line-height: 1.55;
    }
    section {
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 16px;
    }
    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }
    .hint {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .option-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 88px;
      padding: 16px;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 18px;
      background: rgba(255, 255, 255, .72);
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
      user-select: none;
    }
    .option-card.no-end {
      grid-template-columns: 1fr;
    }
    .option-card:hover {
      transform: translateY(-1px);
      border-color: rgba(0, 113, 227, .24);
      box-shadow: 0 14px 34px rgba(0, 113, 227, .08);
    }
    .option-card.is-on {
      border-color: rgba(0, 113, 227, .42);
      background: linear-gradient(180deg, #ffffff 0%, #f4f9ff 100%);
      box-shadow: 0 16px 44px rgba(0, 113, 227, .12);
    }
    .option-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 17px;
      font-weight: 680;
    }
    .mark {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #eef0f3;
      color: transparent;
      font-size: 14px;
      font-weight: 800;
    }
    .option-card.is-on .mark {
      background: var(--blue);
      color: #fff;
    }
    .option-desc {
      margin: 8px 0 0 34px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    .end-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 112px;
      padding: 10px 12px;
      border-radius: 999px;
      background: #f5f5f7;
      color: #424245;
      font-size: 13px;
      white-space: nowrap;
    }
    .end-toggle input,
    .bulk-toggle input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--blue);
    }
    .option-card:not(.is-on) .end-toggle {
      opacity: .48;
    }
    .bulk-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin: 14px 0 18px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, .62);
    }
    .bulk-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #424245;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .linkbox {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }
    input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 16px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    button,
    a.button {
      border: 0;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      padding: 12px 20px;
      font: inherit;
      font-size: 15px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .ghost {
      background: var(--blue-soft);
      color: #0066cc;
    }
    .preview {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    @media (max-width: 720px) {
      main { padding-top: 46px; }
      section {
        padding: 18px;
        border-radius: 22px;
      }
      .hero { margin-bottom: 24px; }
      .lead { font-size: 16px; }
      .section-head,
      .bulk-row {
        align-items: stretch;
        flex-direction: column;
      }
      .option-grid { grid-template-columns: 1fr; }
      .option-card {
        min-height: 80px;
        padding: 14px;
      }
      .end-toggle { min-width: 104px; }
      .row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <p class="eyebrow">Sky: Children of the Light</p>
      <h1>光遇日历订阅</h1>
      <p class="lead">点亮想关注的内容，复制链接后添加到手机日历。需要少打扰的项目，勾上“仅结束”。</p>
    </div>

    <section>
      <div class="section-head">
        <div>
          <h2>订阅内容</h2>
          <p class="hint">点击卡片选择订阅，右侧勾选表示只保留结束提醒。</p>
        </div>
        <p class="preview" id="preview"></p>
      </div>

      <div class="option-grid" id="options">
        <div class="option-card no-end is-on" data-type="red">
          <div>
            <div class="option-title"><span class="mark">✓</span><span>红石</span></div>
            <p class="option-desc">每天只取最后一场红石。</p>
          </div>
        </div>
        <div class="option-card no-end is-on" data-type="black">
          <div>
            <div class="option-title"><span class="mark">✓</span><span>黑石</span></div>
            <p class="option-desc">每天只取最后一场黑石。</p>
          </div>
        </div>
        <div class="option-card is-on" data-type="traveling_spirit">
          <div>
            <div class="option-title"><span class="mark">✓</span><span>旅行先祖</span></div>
            <p class="option-desc">复刻开始与离开提醒。</p>
          </div>
          <label class="end-toggle"><span>仅结束</span><input type="checkbox" data-endonly="traveling_spirit"></label>
        </div>
        <div class="option-card is-on" data-type="season">
          <div>
            <div class="option-title"><span class="mark">✓</span><span>季节</span></div>
            <p class="option-desc">季节开始与结束提醒。</p>
          </div>
          <label class="end-toggle"><span>仅结束</span><input type="checkbox" data-endonly="season"></label>
        </div>
        <div class="option-card is-on" data-type="activity">
          <div>
            <div class="option-title"><span class="mark">✓</span><span>活动</span></div>
            <p class="option-desc">节日、运营活动和限时内容。</p>
          </div>
          <label class="end-toggle"><span>仅结束</span><input type="checkbox" data-endonly="activity"></label>
        </div>
        <div class="option-card is-on" data-type="bonus">
          <div>
            <div class="option-title"><span class="mark">✓</span><span>双倍</span></div>
            <p class="option-desc">双倍心火、爱心、烛火等。</p>
          </div>
          <label class="end-toggle"><span>仅结束</span><input type="checkbox" data-endonly="bonus"></label>
        </div>
        <div class="option-card is-on" data-type="candle_heap">
          <div>
            <div class="option-title"><span class="mark">✓</span><span>大蜡烛</span></div>
            <p class="option-desc">大蜡烛堆相关限时活动。</p>
          </div>
          <label class="end-toggle"><span>仅结束</span><input type="checkbox" data-endonly="candle_heap"></label>
        </div>
        <div class="option-card no-end" data-type="maintenance">
          <div>
            <div class="option-title"><span class="mark">✓</span><span>维护</span></div>
            <p class="option-desc">停服升级维护公告。</p>
          </div>
        </div>
      </div>

      <div class="bulk-row">
        <p class="preview">批量控制上面带“仅结束”的项目。</p>
        <label class="bulk-toggle"><span>全部仅结束</span><input id="endOnlyAll" type="checkbox"></label>
      </div>

      <div class="linkbox">
        <input id="url" type="text" readonly>
        <div class="row">
          <button id="copy" type="button">复制链接</button>
          <a id="open" class="button ghost" href="#">打开订阅</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const cards = [...document.querySelectorAll('.option-card')];
    const endOnlyChecks = [...document.querySelectorAll('input[data-endonly]')];
    const endOnlyAll = document.querySelector('#endOnlyAll');
    const urlInput = document.querySelector('#url');
    const openLink = document.querySelector('#open');
    const preview = document.querySelector('#preview');

    function selectedTypes() {
      return cards.filter(card => card.classList.contains('is-on')).map(card => card.dataset.type);
    }

    function selectedEndOnly() {
      const active = new Set(selectedTypes());
      return endOnlyChecks
        .filter(input => input.checked && active.has(input.dataset.endonly))
        .map(input => input.dataset.endonly);
    }

    function syncEndOnlyAll() {
      const checked = endOnlyChecks.filter(input => input.checked).length;
      endOnlyAll.checked = checked === endOnlyChecks.length;
      endOnlyAll.indeterminate = checked > 0 && checked < endOnlyChecks.length;
    }

    function update() {
      const types = selectedTypes();
      const endOnly = selectedEndOnly();
      const params = new URLSearchParams();
      params.set('types', types.length ? types.join(',') : 'none');
      if (endOnly.length) params.set('endOnly', endOnly.join(','));
      const value = `${location.origin}/calendar.ics?${params.toString()}`;
      urlInput.value = value;
      openLink.href = value;
      preview.textContent = `已选 ${types.length} 项 · 仅结束 ${endOnly.length} 项`;
      syncEndOnlyAll();
    }

    cards.forEach(card => {
      card.addEventListener('click', event => {
        if (event.target.closest('.end-toggle')) return;
        card.classList.toggle('is-on');
        update();
      });
    });

    endOnlyChecks.forEach(input => {
      input.addEventListener('click', event => event.stopPropagation());
      input.addEventListener('change', update);
    });

    endOnlyAll.addEventListener('change', () => {
      endOnlyChecks.forEach(input => {
        input.checked = endOnlyAll.checked;
      });
      update();
    });

    document.querySelector('#copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText(urlInput.value);
    });

    update();
  </script>
</body>
</html>
