name: Sync Events

on:
  schedule:
    - cron: "0 */6 * * *"  # 每6小时
  workflow_dispatch:         # 手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch feeds (90 days)
        run: node src/scripts/fetchFeeds.js 90

      - name: Parse feeds
        run: node src/scripts/parseFeed.js

      - name: Build ICS
        run: node src/scripts/buildEvents.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ feeds.json calendar.ics events.ics
          git diff --cached --quiet || git commit -m "chore: auto sync $(date +'%Y-%m-%d %H:%M')"
          git push
