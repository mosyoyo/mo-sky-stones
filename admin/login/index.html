<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理员登录</title>
  <style>
    body { margin: 0; background: #f7f8fa; color: #202124; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 80px 18px; }
    section { background: #fff; border: 1px solid #dfe3e8; border-radius: 10px; padding: 20px; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 0 0 14px; color: #5f6368; line-height: 1.6; }
    input, button { width: 100%; box-sizing: border-box; border-radius: 8px; font-size: 15px; }
    input { border: 1px solid #c8ced6; padding: 12px 14px; margin-bottom: 12px; }
    button { border: 1px solid #1f6feb; background: #1f6feb; color: #fff; padding: 12px 14px; cursor: pointer; }
    .muted { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>管理员登录</h1>
      <p>输入后台密码后进入审核页。</p>
      <input id="password" type="password" placeholder="后台密码">
      <button id="login">进入后台</button>
      <p id="msg" class="muted"></p>
    </section>
  </main>
  <script>
    const msg = document.querySelector('#msg');
    async function login() {
      msg.textContent = '验证中...';
      const password = document.querySelector('#password').value;
      const res = await fetch('/api/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (!data.ok) {
        msg.textContent = data.error || '登录失败';
        return;
      }
      location.href = '/admin/feed/';
    }
    document.querySelector('#login').onclick = login;
    document.querySelector('#password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
