<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理员登录</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; color: #1d1d1f; background: #f5f5f7; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 0, rgba(255,255,255,.95), rgba(245,245,247,0) 58%),
        #f5f5f7;
    }
    main { width: min(100%, 440px); }
    section {
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 22px 60px rgba(0,0,0,.08);
      backdrop-filter: blur(18px);
    }
    h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: 0; }
    p { margin: 0 0 18px; color: #6e6e73; line-height: 1.65; }
    input, button { width: 100%; border-radius: 999px; font-size: 15px; }
    input { border: 1px solid rgba(0,0,0,.1); padding: 14px 18px; margin-bottom: 12px; background: #fff; }
    button { border: 0; background: #0071e3; color: #fff; padding: 14px 18px; cursor: pointer; }
    .muted { font-size: 13px; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>管理员登录</h1>
      <p>输入后台密码后进入审核页。</p>
      <input id="password" type="password" placeholder="后台密码">
      <button id="login">进入后台</button>
      <p id="msg" class="muted"></p>
    </section>
  </main>
  <script>
    const msg = document.querySelector('#msg');
    async function login() {
      msg.textContent = '验证中...';
      const password = document.querySelector('#password').value;
      const res = await fetch('/api/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (!data.ok) {
        msg.textContent = data.error || '登录失败';
        return;
      }
      location.href = '/admin/feed/';
    }
    document.querySelector('#login').onclick = login;
    document.querySelector('#password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
