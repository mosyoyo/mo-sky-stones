<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公告审核</title>
  <link rel="stylesheet" href="/src/admin/style.css">
  <script src="/src/admin/nav.js" defer></script>
  <script src="/src/admin/common.js" defer></script>
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <h1>公告审核</h1>
        <p class="muted">先看分类，再改标题和时间，最后统一提交。</p>
      </div>
      <div class="toolbar">
        <span id="pendingCount" class="muted">暂无待提交改动</span>
        <button id="commit" disabled>统一提交</button>
      </div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <h2>筛选</h2>
        <div class="filters">
          <label class="chip">
            <span>类型</span>
            <select id="typeFilter">
              <option value="all">全部</option>
              <option value="traveling_spirit">旅行先祖</option>
              <option value="season">季节</option>
              <option value="activity">活动</option>
              <option value="bonus">双倍活动</option>
              <option value="candle_heap">大蜡烛</option>
              <option value="maintenance">维护更新</option>
              <option value="other">其他</option>
            </select>
          </label>
          <label class="chip">
            <span>状态</span>
            <select id="statusFilter">
              <option value="all">全部</option>
              <option value="pending">待审核</option>
              <option value="approved">已批准</option>
              <option value="ignored">已忽略</option>
            </select>
          </label>
          <label class="chip">
            <span>搜索</span>
            <input id="searchBox" type="search" placeholder="标题、正文、先祖、双倍...">
          </label>
          <label class="chip">
            <span>每页</span>
            <select id="pageSize">
              <option value="10">10 条</option>
              <option value="20" selected>20 条</option>
              <option value="50">50 条</option>
            </select>
          </label>
          <label class="pill"><input id="hideOther" type="checkbox" checked>隐藏其他</label>
          <label class="pill"><input id="hideArrived" type="checkbox" checked>隐藏已到来（复刻）</label>
        </div>
        <p class="muted">每条公告都可以单独改标题、类型和时间，右侧会实时预览。</p>
      </aside>
      <section class="workspace">
        <div id="preview" class="preview-card">
          <h2>事件预览</h2>
          <p class="muted">选中一条公告后，这里会显示清洗结果。</p>
          <div id="previewEmpty" class="empty">还没选中公告</div>
          <div id="previewBody" hidden>
            <div class="preview-title" id="previewTitle"></div>
            <div class="preview-meta" id="previewMeta"></div>
            <div class="preview-desc" id="previewDesc"></div>
          </div>
        </div>
        <div class="list-tools">
          <div>
            <strong id="resultCount">0 条公告</strong>
            <span id="pageInfo" class="muted"></span>
          </div>
          <div class="pager">
            <button id="prevPage" class="soft" type="button">上一页</button>
            <button id="nextPage" class="soft" type="button">下一页</button>
          </div>
        </div>
        <div id="list"></div>
      </section>
    </div>
  </main>
  <script>
    const typeNames = { traveling_spirit: '旅行先祖', season: '季节', activity: '活动', bonus: '双倍活动', candle_heap: '大蜡烛', maintenance: '维护更新', other: '其他' };
    const types = Object.keys(typeNames);
    const drafts = new Map();
    let feeds = [];
    let activeId = '';
    let currentPage = 1;
    const h = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const tz = 'Asia/Shanghai';
    const formatDate = value => value ? new Date(value).toLocaleDateString('zh-CN', { timeZone: tz }) : '';
    const formatClock = value => value ? new Date(value).toLocaleTimeString('zh-CN', { timeZone: tz, hour12: false, hour: '2-digit', minute: '2-digit' }) : '';
    const formatTime = value => value ? `${formatDate(value)} ${formatClock(value)}` : '未识别';
    const splitLocal = value => {
      if (!value) return { date: '', time: '' };
      const date = new Date(value);
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: tz,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).formatToParts(date);
      const map = Object.fromEntries(parts.map(part => [part.type, part.value]));
      return { date: `${map.year}-${map.month}-${map.day}`, time: `${map.hour}:${map.minute}` };
    };
    const localToUTC = (datePart, timePart) => {
      if (!datePart || !timePart) return '';
      const [year, month, day] = datePart.split('-').map(Number);
      const [hour, minute] = timePart.split(':').map(Number);
      return new Date(Date.UTC(year, month - 1, day, hour - 8, minute || 0, 0)).toISOString();
    };
    const splitDraft = value => splitLocal(value);
    async function load() {
      const box = document.querySelector('#list');
      box.innerHTML = '<p class="muted">正在读取公告...</p>';
      try {
        const res = await fetch('/api/feed');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        feeds = await res.json();
      } catch (err) {
        box.innerHTML = `<section><strong>公告读取失败</strong><p>${h(err.message)}</p></section>`;
        return;
      }
      if (!feeds.length) {
        box.innerHTML = '<section><strong>暂无公告</strong><p>运行同步后，这里会显示抓到的官方动态。</p></section>';
        return;
      }
      activeId = activeId || feeds[0].id;
      render();
      document.querySelector('#typeFilter').onchange = render;
      document.querySelector('#statusFilter').onchange = render;
      document.querySelector('#hideOther').onchange = render;
      document.querySelector('#hideArrived').onchange = render;
      document.querySelector('#pageSize').onchange = () => {
        currentPage = 1;
        render();
      };
      document.querySelector('#searchBox').oninput = () => {
        currentPage = 1;
        render();
      };
      document.querySelector('#prevPage').onclick = () => {
        currentPage = Math.max(1, currentPage - 1);
        render();
      };
      document.querySelector('#nextPage').onclick = () => {
        currentPage += 1;
        render();
      };
    }
    function filteredFeeds() {
      const typeFilter = document.querySelector('#typeFilter').value;
      const statusFilter = document.querySelector('#statusFilter').value;
      const hideOther = document.querySelector('#hideOther').checked;
      const hideArrived = document.querySelector('#hideArrived')?.checked ?? true;
      const keyword = document.querySelector('#searchBox').value.trim().toLowerCase();
      const arrivedKeywords = ['到临提醒', '到临啦', '重返天空王国', '即将离开', '已离开'];
      return feeds.filter(feed => {
        if (typeFilter !== 'all' && feed.autoType !== typeFilter) return false;
        if (statusFilter !== 'all' && feed.status !== statusFilter) return false;
        if (hideOther && feed.autoType === 'other') return false;
        // 隐藏已到来的复刻先祖公告
        if (hideArrived && feed.autoType === 'traveling_spirit') {
          const text = ((feed.title || '') + '\n' + (feed.content || ''));
          if (arrivedKeywords.some(k => text.includes(k))) return false;
        }
        if (keyword) {
          const haystack = [
            feed.title,
            feed.calendarTitle,
            feed.content,
            feed.autoType,
            feed.status,
            feed.parsedResult?.title,
          ].join('\n').toLowerCase();
          if (!haystack.includes(keyword)) return false;
        }
        return true;
      });
    }
    function render() {
      const visible = filteredFeeds();
      const pageSize = Number(document.querySelector('#pageSize').value || 20);
      const totalPages = Math.max(1, Math.ceil(visible.length / pageSize));
      currentPage = Math.min(Math.max(1, currentPage), totalPages);
      const startIndex = (currentPage - 1) * pageSize;
      const pageItems = visible.slice(startIndex, startIndex + pageSize);
      updatePagination(visible.length, startIndex, pageItems.length, totalPages);
      if (!visible.length) {
        document.querySelector('#list').innerHTML = '<section><strong>没有符合条件的公告</strong><p>换个筛选条件试试。</p></section>';
        renderPreview(null);
        updateToolbar();
        return;
      }
      const current = pageItems.find(feed => feed.id === activeId) || pageItems[0] || visible[0];
      activeId = current.id;
      renderPreview(current);
      document.querySelector('#list').innerHTML = pageItems.map(feed => {
        const draft = drafts.get(feed.id) || {};
        const statusText = draft.status || feed.status;
        return `
        <section class="feed-item ${feed.id === activeId ? 'selected' : ''}" data-feed="${h(feed.id)}" data-type="${h(feed.autoType)}" data-status="${h(statusText)}">
          <div class="top">
            <div>
              <strong>${h(draft.title || feed.calendarTitle || feed.title || feed.id)}</strong>
              <div class="meta">${new Date(feed.createTime || Date.now()).toLocaleString('zh-CN', { hour12: false })}</div>
            </div>
            <span class="status ${h(statusText)}">${h(statusText)}</span>
          </div>
          <div class="row" style="margin-top:12px">
            <span class="tag ${h(feed.autoType)}">${h(typeNames[feed.autoType] || feed.autoType || '未知')}</span>
            <span class="tag">${feed.parsed ? '已识别时间' : '未识别时间'}</span>
          </div>
          <div class="grid">
            <label class="field">
              <span>日历标题</span>
              <input data-field="title" value="${h(draft.title ?? feed.calendarTitle ?? feed.title ?? '')}">
            </label>
            <label class="field">
              <span>类型</span>
              <select data-field="type">${types.map(type => `<option value="${type}" ${(draft.type ?? feed.autoType) === type ? 'selected' : ''}>${typeNames[type]}</option>`).join('')}</select>
            </label>
            <div class="date-card">
              <span class="field-label">开始时间</span>
              <div class="date-grid">
                <input type="date" data-field="start-date" value="${h(splitDraft(draft.start || feed.parsedResult?.start || '').date)}">
                <input type="time" data-field="start-time" value="${h(splitDraft(draft.start || feed.parsedResult?.start || '').time)}">
              </div>
            </div>
            <div class="date-card">
              <span class="field-label">结束时间</span>
              <div class="date-grid">
                <input type="date" data-field="end-date" value="${h(splitDraft(draft.end || feed.parsedResult?.end || '').date)}">
                <input type="time" data-field="end-time" value="${h(splitDraft(draft.end || feed.parsedResult?.end || '').time)}">
              </div>
            </div>
          </div>
          <p class="muted">解析时间：${h(formatTime(feed.parsedResult?.start))} - ${h(formatTime(feed.parsedResult?.end))}</p>
          <details>
            <summary>原文</summary>
            <pre>${h(feed.content || '')}</pre>
          </details>
          <div class="row">
            <button data-action="approved" data-id="${feed.id}">标记批准</button>
            <button class="ghost" data-action="ignored" data-id="${feed.id}">标记忽略</button>
          </div>
        </section>`;
      }).join('');
      bindCardEvents();
      updateToolbar();
    }
    function updatePagination(total, startIndex, pageCount, totalPages) {
      document.querySelector('#resultCount').textContent = `${total} 条公告`;
      document.querySelector('#pageInfo').textContent = total
        ? ` · 第 ${currentPage}/${totalPages} 页 · ${startIndex + 1}-${startIndex + pageCount}`
        : '';
      document.querySelector('#prevPage').disabled = currentPage <= 1;
      document.querySelector('#nextPage').disabled = currentPage >= totalPages;
    }
    function renderPreview(feed) {
      const empty = document.querySelector('#previewEmpty');
      const body = document.querySelector('#previewBody');
      if (!feed) {
        empty.hidden = false;
        body.hidden = true;
        return;
      }
      const draft = drafts.get(feed.id) || {};
      const title = draft.title || feed.calendarTitle || feed.title || feed.id;
      const start = draft.start || feed.parsedResult?.start;
      const end = draft.end || feed.parsedResult?.end;
      empty.hidden = true;
      body.hidden = false;
      document.querySelector('#previewTitle').textContent = title;
      document.querySelector('#previewMeta').textContent = `${typeNames[draft.type || feed.autoType] || draft.type || feed.autoType} · ${formatTime(start)} — ${formatTime(end)}`;
      document.querySelector('#previewDesc').textContent = feed.content || '';
    }
    function readDraft(section) {
      const field = name => section.querySelector(`[data-field="${name}"]`)?.value.trim();
      return {
        title: field('title'),
        type: field('type'),
        start: localToUTC(field('start-date'), field('start-time')),
        end: localToUTC(field('end-date'), field('end-time')),
      };
    }
    function syncDraft(feedId, section) {
      const feed = feeds.find(item => item.id === feedId);
      if (!feed || !section) return;
      const prev = drafts.get(feedId) || {};
      const next = { ...prev, feedId, ...readDraft(section) };
      drafts.set(feedId, next);
      renderPreview(feed);
      updateToolbar();
    }
    function bindCardEvents() {
      document.querySelectorAll('.feed-item').forEach(section => {
        const feedId = section.dataset.feed;
        section.onclick = event => {
          if (event.target.closest('input,select,button,details,summary,textarea')) return;
          activeId = feedId;
          render();
        };
        section.querySelectorAll('[data-field]').forEach(el => {
          el.oninput = () => {
            syncDraft(feedId, section);
            section.dataset.pending = drafts.get(feedId)?.status || '';
          };
        });
      });
      document.querySelectorAll('button[data-action]').forEach(btn => btn.onclick = () => {
        const feedId = btn.dataset.id;
        activeId = feedId;
        const section = btn.closest('section');
        const next = { ...(drafts.get(feedId) || {}), feedId, ...readDraft(section), status: btn.dataset.action };
        drafts.set(feedId, next);
        render();
        const currentSection = document.querySelector(`.feed-item[data-feed="${CSS.escape(feedId)}"]`);
        if (currentSection) currentSection.dataset.pending = btn.dataset.action;
      });
    }
    function updateToolbar() {
      const count = drafts.size;
      document.querySelector('#pendingCount').textContent = count ? `待提交 ${count} 条改动` : '暂无待提交改动';
      document.querySelector('#commit').disabled = count === 0;
    }
    async function commitDrafts() {
      if (!drafts.size) return;
      const btn = document.querySelector('#commit');
      btn.disabled = true;
      btn.textContent = '提交中...';
      const res = await fetch('/api/feed-batch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: [...drafts.values()] }),
      });
      const data = await res.json();
      if (!data.ok) {
        window.AdminCommon?.showToast?.(data.error || '保存失败', 'error');
      } else {
        window.AdminCommon?.showToast?.('已提交公告改动', 'success');
      }
      drafts.clear();
      btn.textContent = '统一提交';
      await load();
    }
    document.querySelector('#commit').onclick = commitDrafts;
    load();
  </script>
</body>
</html>
