<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同步日志</title>
  <link rel="stylesheet" href="/src/admin/style.css">
</head>
<body>
  <main>
    <nav class="shell-nav">
      <a href="/">订阅</a>
      <a href="/admin/feed/">公告</a>
      <a href="/admin/events/">事件</a>
      <a class="active" href="/admin/sync/">同步</a>
    </nav>
    <header class="hero">
      <div>
        <h1>同步日志</h1>
        <p class="muted">抓取、解析和生成事件的记录都在这里。</p>
      </div>
    </header>
    <div id="list" class="log-grid"></div>
  </main>
  <script>
    const h = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    fetch('/api/sync').then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }).then(logs => {
      if (!logs.length) {
        document.querySelector('#list').innerHTML = '<section><strong>暂无同步日志</strong><p>同步脚本运行后会写入这里。</p></section>';
        return;
      }
      document.querySelector('#list').innerHTML = logs.map(log => `
        <section class="log-item">
          <strong>${new Date(log.time).toLocaleString('zh-CN', { hour12: false })}</strong>
          <p>${h(log.message || '')}</p>
          <details>
            <summary>查看原始记录</summary>
            <pre>${h(JSON.stringify(log, null, 2))}</pre>
          </details>
        </section>`).join('');
    }).catch(err => {
      document.querySelector('#list').innerHTML = `<section><strong>同步日志读取失败</strong><p>${h(err.message)}</p></section>`;
    });
  </script>
</body>
</html>
