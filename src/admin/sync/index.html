<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同步日志</title>
  <link rel="stylesheet" href="/src/admin/style.css">
  <script src="/src/admin/nav.js" defer></script>
  <script src="/src/admin/common.js" defer></script>
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <h1>同步日志</h1>
        <p class="muted">抓取、解析和生成事件的记录都在这里。</p>
      </div>
    </header>
    <section>
      <div class="toolbar">
        <label class="chip">
          <span>状态</span>
          <select id="statusFilter">
            <option value="all">全部</option>
            <option value="success">成功</option>
            <option value="failed">失败</option>
          </select>
        </label>
        <label class="chip">
          <span>来源</span>
          <select id="sourceFilter">
            <option value="all">全部来源</option>
          </select>
        </label>
      </div>
    </section>
    <div id="list" class="log-grid"></div>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const { fetchJSON, formatFullDate, h } = window.AdminCommon;
      let logs = [];

      document.querySelector('#statusFilter').onchange = render;
      document.querySelector('#sourceFilter').onchange = render;

      function statusOf(log) {
        return log.error || /失败|failed|error/i.test(log.message || '') ? 'failed' : 'success';
      }

      async function load() {
        try {
          logs = await fetchJSON('/api/sync');
          const sources = [...new Set(logs.map(log => log.source).filter(Boolean))].sort();
          document.querySelector('#sourceFilter').innerHTML = '<option value="all">全部来源</option>' +
            sources.map(source => `<option value="${h(source)}">${h(source)}</option>`).join('');
          render();
        } catch (err) {
          document.querySelector('#list').innerHTML = `<section><strong>同步日志读取失败</strong><p>${h(err.message)}</p></section>`;
        }
      }

      function render() {
        const status = document.querySelector('#statusFilter').value;
        const source = document.querySelector('#sourceFilter').value;
        const visible = logs
          .filter(log => status === 'all' || statusOf(log) === status)
          .filter(log => source === 'all' || log.source === source)
          .sort((a, b) => new Date(b.time || 0) - new Date(a.time || 0));
        if (!visible.length) {
          document.querySelector('#list').innerHTML = '<section><strong>暂无同步日志</strong><p>当前筛选条件下没有记录。</p></section>';
          return;
        }
        document.querySelector('#list').innerHTML = visible.map(log => {
          const state = statusOf(log);
          return `
            <section class="card">
              <div class="top">
                <strong>${h(formatFullDate(log.time))}</strong>
                <div class="row">
                  <span class="tag ${state === 'failed' ? 'danger' : 'success'}">${state === 'failed' ? '失败' : '成功'}</span>
                  ${log.source ? `<span class="tag">${h(log.source)}</span>` : ''}
                  ${log.durationMs ? `<span class="tag">${Math.round(log.durationMs)}ms</span>` : ''}
                </div>
              </div>
              <p>${h(log.message || '')}</p>
              <details>
                <summary>查看原始记录</summary>
                <pre>${h(JSON.stringify(log, null, 2))}</pre>
              </details>
            </section>`;
        }).join('');
      }

      load();
    });
  </script>
</body>
</html>
