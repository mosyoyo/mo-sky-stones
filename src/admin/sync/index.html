<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>同步日志</title>
  <link rel="stylesheet" href="/src/admin/style.css">
</head>
<body>
  <main>
    <nav><a href="/">订阅</a><a href="/admin/feed/">公告</a><a href="/admin/events/">事件</a></nav>
    <h1>同步日志</h1>
    <div id="list"></div>
  </main>
  <script>
    fetch('/api/sync').then(r => r.json()).then(logs => {
      document.querySelector('#list').innerHTML = logs.map(log => `
        <section>
          <strong>${new Date(log.time).toLocaleString()}</strong>
          <p>${log.message || ''}</p>
          <pre>${JSON.stringify(log, null, 2)}</pre>
        </section>`).join('');
    });
  </script>
</body>
</html>
