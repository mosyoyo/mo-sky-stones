<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先祖订阅</title>
  <link rel="stylesheet" href="/src/admin/style.css">
  <script src="/src/admin/nav.js" defer></script>
  <script src="/src/admin/common.js" defer></script>
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <h1>先祖资料</h1>
        <p class="muted">编辑季节和兑换物品；公开指定先祖页会用这些内容做搜索和备注。</p>
      </div>
      <button id="save">统一保存</button>
    </header>
    <section>
      <div class="toolbar">
        <span class="muted" id="status">正在读取先祖列表...</span>
        <a class="pill" href="/spirits">打开公开选择页</a>
        <label class="pill"><input id="onlySelected" type="checkbox">仅看已订阅</label>
      </div>
    </section>
    <div id="list" class="log-grid"></div>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const { fetchJSON, h, showToast } = window.AdminCommon;
      const list = document.querySelector('#list');
      const status = document.querySelector('#status');
      const onlySelected = document.querySelector('#onlySelected');
      const saveBtn = document.querySelector('#save');
      let items = [];
      let selected = new Set();
      const drafts = new Map();

      function spiritLabel(item) {
        return item.englishName ? `${item.spiritName} · ${item.englishName}` : item.spiritName;
      }

      function spiritMeta(item) {
        return [item.season, item.lastRevisit ? `上次 ${item.lastRevisit}` : '', item.map].filter(Boolean).join(' · ');
      }

      function render() {
        const visible = items.filter(item => !onlySelected.checked || selected.has(item.spiritName));
        document.querySelector('#list').innerHTML = visible.map(item => {
          const on = selected.has(item.spiritName);
          const draft = drafts.get(item.spiritName) || {};
          const season = draft.season ?? item.season ?? '';
          const itemText = draft.itemsText ?? (Array.isArray(item.items) ? item.items.join('、') : '');
          return `
            <section class="card">
              <div class="top">
                <div>
                  <strong>${h(spiritLabel(item))}</strong>
                  <span class="muted" style="margin-left:6px">${h(spiritMeta(item))}</span>
                </div>
                <label class="event-enabled">
                  <input type="checkbox" data-spirit="${h(item.spiritName)}" ${on ? 'checked' : ''}>
                  <span>${on ? '已订阅' : '未订阅'}</span>
                </label>
              </div>
              <div class="grid" style="margin-top:12px">
                <label class="field">
                  <span>季节</span>
                  <input data-field="season" data-name="${h(item.spiritName)}" value="${h(season)}" placeholder="例如 欧若拉季">
                </label>
                <label class="field">
                  <span>物品</span>
                  <input data-field="items" data-name="${h(item.spiritName)}" value="${h(itemText)}" placeholder="用顿号或逗号分隔，例如 面具、发型、斗篷">
                </label>
              </div>
            </section>`;
        }).join('');

        document.querySelectorAll('[data-spirit]').forEach(input => {
          input.onchange = () => {
            const name = input.dataset.spirit;
            if (input.checked) selected.add(name);
            else selected.delete(name);
            render();
          };
        });
        document.querySelectorAll('[data-field]').forEach(input => {
          input.oninput = () => {
            const name = input.dataset.name;
            const item = items.find(x => x.spiritName === name);
            const draft = drafts.get(name) || { spiritName: name, season: item?.season || '', itemsText: Array.isArray(item?.items) ? item.items.join('、') : '' };
            if (input.dataset.field === 'season') draft.season = input.value.trim();
            if (input.dataset.field === 'items') draft.itemsText = input.value.trim();
            drafts.set(name, draft);
            status.textContent = `待保存 ${drafts.size} 个先祖，默认订阅 ${selected.size} 个。`;
          };
        });
        status.textContent = drafts.size ? `待保存 ${drafts.size} 个先祖，默认订阅 ${selected.size} 个。` : `共 ${items.length} 个先祖，默认订阅 ${selected.size} 个。`;
      }

      async function load() {
        try {
          const data = await fetchJSON('/api/spirits');
          items = Array.isArray(data.items) ? data.items : [];
          selected = new Set(Array.isArray(data.selected) ? data.selected : []);
          render();
        } catch (err) {
          list.innerHTML = `<section class="card"><strong>读取失败</strong><p class="muted">${h(err.message)}</p></section>`;
          status.textContent = '读取失败';
        }
      }

      saveBtn.onclick = async () => {
        saveBtn.disabled = true;
        saveBtn.textContent = '保存中...';
        try {
          const data = await fetchJSON('/api/spirits', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              selected: [...selected],
              items: [...drafts.values()].map(item => ({
                spiritName: item.spiritName,
                season: item.season,
                items: String(item.itemsText || '').split(/[、,，\n]/).map(x => x.trim()).filter(Boolean),
              })),
            }),
          });
          showToast(`已保存${data.commit ? `：${data.commit.slice(0, 7)}` : ''}`, 'success');
          status.textContent = `已保存，默认订阅 ${selected.size} 个先祖。`;
          drafts.clear();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = '统一保存';
        }
      };

      onlySelected.onchange = render;
      load();
    });
  </script>
</body>
</html>
