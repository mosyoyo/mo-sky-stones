<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sky-ics | 指定先祖订阅</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --card: rgba(255, 255, 255, .86);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(60, 60, 67, .14);
      --blue: #007aff;
      --blue-soft: #e8f2ff;
      --shadow: 0 18px 46px rgba(0, 0, 0, .07);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 58%, #efeff4 100%);
    }
    main {
      width: min(760px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 14px 170px;
    }
    .nav {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0 10px;
      background: rgba(245, 245, 247, .78);
      backdrop-filter: blur(18px);
    }
    .back {
      color: var(--blue);
      text-decoration: none;
      font-size: 15px;
      font-weight: 650;
    }
    .count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    header {
      padding: 16px 2px 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 56px);
      line-height: 1.04;
      letter-spacing: 0;
      font-weight: 780;
    }
    .lead {
      margin: 10px 0 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .filters {
      position: sticky;
      top: 44px;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(150px, .45fr);
      gap: 10px;
      padding: 8px 0 12px;
      background: rgba(245, 245, 247, .78);
      backdrop-filter: blur(18px);
    }
    input[type="search"],
    input[type="text"],
    select {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .86);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-size: 15px;
      outline: none;
    }
    select {
      appearance: none;
      -webkit-appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #6e6e73 50%),
        linear-gradient(135deg, #6e6e73 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 20px,
        calc(100% - 12px) 20px;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 32px;
    }
    input:focus {
      border-color: rgba(0, 122, 255, .42);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, .11);
    }
    .list {
      display: grid;
      gap: 10px;
    }
    .spirit {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 72px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
      cursor: pointer;
      text-align: left;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .spirit:active { transform: scale(.99); }
    .spirit.is-selected {
      border-color: rgba(0, 122, 255, .48);
      background: linear-gradient(180deg, #fff 0%, var(--blue-soft) 100%);
    }
    .spirit.is-disabled {
      opacity: .48;
      cursor: default;
    }
    .name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 17px;
      font-weight: 720;
    }
    .meta {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #eef0f3;
      color: transparent;
      font-weight: 800;
      font-size: 14px;
    }
    .is-selected .mark {
      background: var(--blue);
      color: #fff;
    }
    .empty {
      padding: 26px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      color: var(--muted);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .dock {
      position: fixed;
      left: 50%;
      bottom: 14px;
      z-index: 4;
      width: min(760px, calc(100vw - 24px));
      transform: translateX(-50%);
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 22px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .12);
      backdrop-filter: blur(22px);
    }
    .dock-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      min-width: 72px;
      border: 0;
      border-radius: 999px;
      padding: 0 16px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .button.secondary {
      background: var(--blue-soft);
      color: #0066cc;
    }
    .button:disabled {
      opacity: .42;
      cursor: default;
    }
    .hint {
      margin: 8px 4px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 104px;
      z-index: 5;
      width: min(360px, calc(100vw - 32px));
      transform: translate(-50%, 12px);
      opacity: 0;
      padding: 11px 14px;
      border-radius: 16px;
      background: rgba(29, 29, 31, .92);
      color: #fff;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    @media (max-width: 560px) {
      main { padding: 10px 10px 176px; }
      .nav { padding-top: 8px; }
      header { padding-top: 12px; }
      h1 { font-size: 32px; }
      .lead { font-size: 13px; }
      .filters {
        top: 42px;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .spirit { min-height: 64px; border-radius: 16px; box-shadow: none; }
      .name { font-size: 16px; }
      .dock { bottom: 10px; border-radius: 20px; }
      .dock-row { grid-template-columns: 1fr 1fr; }
      .dock input { grid-column: 1 / -1; height: 38px; }
      .button { width: 100%; height: 38px; min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <nav class="nav">
      <a class="back" href="/subscribe">返回</a>
      <span class="count" id="count">已选 0 / 3</span>
    </nav>

    <header>
      <h1>指定先祖订阅</h1>
      <p class="lead">选择你想单独关注的复刻先祖，生成一个只属于这几个先祖的日历订阅链接。</p>
    </header>

    <div class="filters">
      <input id="search" type="search" placeholder="搜索名字、季节、物品" autocomplete="off">
      <select id="seasonFilter" aria-label="按季节筛选">
        <option value="all">全部季节</option>
      </select>
    </div>

    <section class="list" id="list" aria-live="polite"></section>
  </main>

  <section class="dock" aria-label="订阅链接">
    <div class="dock-row">
      <input id="url" type="text" readonly value="选择先祖后生成链接">
      <button id="copy" class="button" type="button" disabled>复制</button>
      <a id="open" class="button secondary" href="#" aria-disabled="true">添加</a>
    </div>
    <p class="hint" id="hint">最多选择 3 个。未返场时日历可能暂时为空，返场后会自动出现。</p>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const list = document.querySelector('#list');
    const search = document.querySelector('#search');
    const seasonFilter = document.querySelector('#seasonFilter');
    const count = document.querySelector('#count');
    const urlInput = document.querySelector('#url');
    const copyButton = document.querySelector('#copy');
    const openLink = document.querySelector('#open');
    const hint = document.querySelector('#hint');
    const toast = document.querySelector('#toast');
    const selected = new Set();
    let spirits = [];

    function initialSelected() {
      const raw = new URLSearchParams(location.search).get('spirits') || '';
      return raw.split(',').map(name => name.trim()).filter(Boolean).slice(0, 3);
    }

    function spiritName(event) {
      return String(event.title || '')
        .replace(/^【[^】]+】/, '')
        .trim();
    }

    function beijingDate(iso) {
      if (!iso) return '';
      return new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).format(new Date(iso));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function h(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function subscriptionUrl() {
      const names = [...selected];
      if (!names.length) return '';
      const params = new URLSearchParams();
      params.set('spirits', names.join(','));
      return `${location.origin}/spirit-events.ics?${params.toString()}`;
    }

    function webcalUrl(url) {
      return url.replace(/^https?:\/\//, 'webcal://');
    }

    function updateLink() {
      const url = subscriptionUrl();
      count.textContent = `已选 ${selected.size} / 3`;
      copyButton.disabled = !url;
      if (url) {
        urlInput.value = url;
        openLink.href = webcalUrl(url);
        openLink.removeAttribute('aria-disabled');
        hint.textContent = `已选择：${[...selected].join('、')}`;
      } else {
        urlInput.value = '选择先祖后生成链接';
        openLink.href = '#';
        openLink.setAttribute('aria-disabled', 'true');
        hint.textContent = '最多选择 3 个。未返场时日历可能暂时为空，返场后会自动出现。';
      }
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const season = seasonFilter.value;
      const visible = spirits.filter(item => {
        if (season !== 'all' && item.season !== season) return false;
        return !q || item.searchText.includes(q);
      });
      if (!visible.length) {
        list.innerHTML = '<div class="empty">没有找到符合条件的先祖。</div>';
        updateLink();
        return;
      }
      list.innerHTML = visible.map(item => {
        const on = selected.has(item.name);
        const disabled = !on && selected.size >= 3;
        return `
          <button class="spirit ${on ? 'is-selected' : ''} ${disabled ? 'is-disabled' : ''}" type="button" data-name="${h(item.name)}">
            <span>
              <span class="name">${h(item.name)}</span>
              <span class="meta">${h(item.meta)}</span>
            </span>
            <span class="mark">✓</span>
          </button>`;
      }).join('');
      list.querySelectorAll('.spirit').forEach(button => {
        button.addEventListener('click', () => {
          const name = button.dataset.name;
          if (selected.has(name)) selected.delete(name);
          else if (selected.size < 3) selected.add(name);
          else showToast('最多选择 3 个先祖');
          render();
        });
      });
      updateLink();
    }

    async function load() {
      try {
        const [eventsRes, soulsRes] = await Promise.all([
          fetch('/data/events.json', { cache: 'no-store' }),
          fetch('/data/soul-spirits.json', { cache: 'no-store' }),
        ]);
        if (!eventsRes.ok) throw new Error(`events HTTP ${eventsRes.status}`);
        const events = await eventsRes.json();
        const soulData = soulsRes.ok ? await soulsRes.json() : null;
        const activeMap = new Map((Array.isArray(events) ? events : [])
          .filter(event => event.enabled !== false && event.type === 'traveling_spirit')
          .map(event => [spiritName(event), event]));
        const seen = new Set();
        const source = Array.isArray(soulData?.spirits) && soulData.spirits.length
          ? soulData.spirits.map(item => {
            const active = activeMap.get(item.spiritName);
            const items = Array.isArray(item.items) ? item.items : [];
            return {
              name: item.spiritName,
              season: item.season || '',
              items,
              start: active?.start || '',
              end: active?.end || '',
              lastRevisit: item.lastRevisit || '',
              meta: active
                ? `${beijingDate(active.start)} 到来 · ${beijingDate(active.end)} 离开`
                : `${item.season || '未知季节'} · 上次 ${item.lastRevisit || '未知'}`,
            };
          })
          : [...activeMap.values()].map(event => ({
            name: spiritName(event),
            season: '',
            items: [],
            start: event.start,
            end: event.end,
            lastRevisit: event.start || '',
            meta: `${beijingDate(event.start)} 到来 · ${beijingDate(event.end)} 离开`,
          }));
        spirits = source
          .filter(item => item.name && !seen.has(item.name) && seen.add(item.name))
          .map(item => ({
            ...item,
            searchText: [item.name, item.season, item.lastRevisit, ...(item.items || [])].join('\n').toLowerCase(),
          }))
          .sort((a, b) => String(b.lastRevisit || b.start).localeCompare(String(a.lastRevisit || a.start)));
        const seasons = [...new Set(spirits.map(item => item.season).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
        seasonFilter.innerHTML = '<option value="all">全部季节</option>' + seasons.map(season => `<option value="${h(season)}">${h(season)}</option>`).join('');
        const names = new Set(spirits.map(item => item.name));
        initialSelected().forEach(name => {
          if (names.has(name)) selected.add(name);
        });
        render();
      } catch (err) {
        list.innerHTML = `<div class="empty">读取复刻列表失败：${err.message}</div>`;
      }
    }

    search.addEventListener('input', render);
    seasonFilter.addEventListener('change', render);
    copyButton.addEventListener('click', async () => {
      const url = subscriptionUrl();
      if (!url) return;
      try {
        await navigator.clipboard.writeText(url);
        showToast('已复制订阅链接');
      } catch (_) {
        urlInput.select();
        showToast('浏览器不允许自动复制，请手动复制');
      }
    });
    openLink.addEventListener('click', event => {
      const url = subscriptionUrl();
      if (!url) {
        event.preventDefault();
        return;
      }
      const ua = navigator.userAgent || '';
      const isAppleMobile = /iPhone|iPad|iPod/i.test(ua);
      if (isAppleMobile) return;
      event.preventDefault();
      navigator.clipboard.writeText(url)
        .then(() => showToast('已复制 HTTPS 订阅链接，请粘贴到日历 App'))
        .catch(() => {
          urlInput.select();
          showToast('请手动复制 HTTPS 订阅链接');
        });
    });

    load();
  </script>
</body>
</html>
