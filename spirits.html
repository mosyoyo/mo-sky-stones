<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sky-ics | 指定先祖订阅</title>
  <meta name="description" content="指定关注光遇复刻先祖，生成只包含所选旅行先祖返场提醒的手机日历订阅链接。">
  <link rel="canonical" href="https://sky-ics.pages.dev/spirits">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="sky-ics">
  <meta property="og:title" content="sky-ics | 指定先祖订阅">
  <meta property="og:description" content="搜索并选择指定旅行先祖，生成专属复刻返场日历订阅。">
  <meta property="og:url" content="https://sky-ics.pages.dev/spirits">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="sky-ics | 指定先祖订阅">
  <meta name="twitter:description" content="选择指定复刻先祖，生成只关注这些先祖返场的日历订阅。">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --card: rgba(255, 255, 255, .86);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(60, 60, 67, .14);
      --blue: #007aff;
      --blue-soft: #e8f2ff;
      --shadow: 0 18px 46px rgba(0, 0, 0, .07);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 58%, #efeff4 100%);
    }
    main {
      width: min(760px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 14px 170px;
    }
    .topnav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px 18px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand {
      color: var(--muted);
      font-size: 13px;
      font-weight: 680;
      letter-spacing: .08em;
    }
    .topnav a {
      color: var(--blue);
      text-decoration: none;
      font-size: 14px;
      font-weight: 650;
    }
    .help-button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--blue);
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
    }
    header {
      padding: 6px 4px 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.08;
      letter-spacing: 0;
      font-weight: 760;
    }
    .lead {
      margin: 8px 0 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }
    input[type="search"],
    input[type="text"] {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .86);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: rgba(0, 122, 255, .42);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, .11);
    }
    .controls {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }
    .chips {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 2px 8px;
      cursor: grab;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(60, 60, 67, .24) transparent;
    }
    .chips.is-dragging {
      cursor: grabbing;
      scroll-snap-type: none;
      user-select: none;
    }
    .chips::-webkit-scrollbar { height: 6px; }
    .chips::-webkit-scrollbar-track { background: transparent; }
    .chips::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(60, 60, 67, .2);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .74);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;
      scroll-snap-align: start;
    }
    .chip.is-on {
      border-color: rgba(0, 122, 255, .28);
      background: var(--blue-soft);
      color: #0066cc;
    }
    .selection-panel {
      min-height: 40px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .selected-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .selected-chip {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 11px;
      border: 1px solid rgba(0, 122, 255, .18);
      border-radius: 999px;
      background: var(--blue-soft);
      color: #0066cc;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .list {
      display: grid;
      overflow: auto;
      align-content: start;
      border: 1px solid rgba(0, 0, 0, .04);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .05);
    }
    .spirit {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 54px;
      padding: 9px 12px 9px 16px;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
      user-select: none;
      transition: background .16s ease;
    }
    .spirit + .spirit { border-top: 1px solid var(--line); }
    .spirit:active { transform: scale(.99); }
    .spirit.is-selected {
      background: transparent;
    }
    .spirit.is-disabled {
      opacity: .48;
      cursor: default;
    }
    .name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 16px;
      font-weight: 620;
    }
    .meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #eef0f3;
      color: transparent;
      font-weight: 800;
      font-size: 13px;
      flex: 0 0 auto;
    }
    .is-selected .mark {
      background: var(--blue);
      color: #fff;
    }
    .empty {
      padding: 26px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      color: var(--muted);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .dock {
      position: fixed;
      left: 50%;
      bottom: 14px;
      z-index: 4;
      width: min(732px, calc(100vw - 28px));
      transform: translateX(-50%);
      padding: 12px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .05);
    }
    .dock-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
    }
    .url {
      width: 100%;
      min-width: 0;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f5f5f7;
      color: #3a3a3c;
      padding: 0 12px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      min-width: 78px;
      border: 0;
      border-radius: 999px;
      padding: 0 16px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .button.secondary {
      background: var(--blue-soft);
      color: #0066cc;
    }
    .button:disabled {
      opacity: .42;
      cursor: default;
    }
    .hint {
      margin: 8px 4px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 104px;
      z-index: 5;
      width: min(360px, calc(100vw - 32px));
      transform: translate(-50%, 12px);
      opacity: 0;
      padding: 11px 14px;
      border-radius: 16px;
      background: rgba(29, 29, 31, .92);
      color: #fff;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    @media (max-width: 640px) {
      main { padding: 14px 10px 176px; }
      .topnav { padding-bottom: 12px; }
      header { padding-bottom: 10px; }
      h1 { font-size: 30px; }
      .lead { font-size: 13px; }
      .controls { gap: 8px; }
      .list { border-radius: 16px; box-shadow: none; }
      .spirit { min-height: 47px; padding: 7px 10px 7px 12px; }
      .name { font-size: 15px; }
      .dock { bottom: 10px; width: calc(100vw - 20px); padding: 10px; }
      .dock-row { grid-template-columns: 1fr 1fr; }
      .url { grid-column: 1 / -1; height: 38px; }
      .button { width: 100%; height: 38px; min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <nav class="topnav">
      <div class="nav-links">
        <a href="/">返回主页</a>
        <a href="/subscribe">自定义订阅</a>
      </div>
      <span class="brand">SKY CALENDAR</span>
      <a class="help-button" href="/help" aria-label="使用帮助" title="使用帮助">?</a>
    </nav>

    <header>
      <h1>指定先祖订阅</h1>
      <p class="lead">选择你想单独关注的复刻先祖，生成一个只属于这几个先祖的日历订阅链接。</p>
    </header>

    <section class="controls" aria-label="筛选先祖">
      <input id="search" type="search" placeholder="搜索名字、季节、物品" autocomplete="off">
      <div class="chips" id="seasonChips" aria-label="按季节筛选"></div>
    </section>

    <section class="selection-panel" aria-label="已选择的先祖">
      <div class="selected-chips" id="selectedChips">还没有选择先祖。</div>
    </section>

    <section class="list" id="list" aria-live="polite"></section>
  </main>

  <section class="dock" aria-label="订阅操作">
    <div class="dock-row">
      <input id="url" class="url" type="text" readonly placeholder="选择先祖后生成订阅链接">
      <button id="copyButton" class="button secondary" type="button" disabled>复制</button>
      <a id="openButton" class="button" href="#" aria-disabled="true">添加</a>
    </div>
    <p class="hint"><span id="count">已选 0 / 3</span> · <span id="hintText">最多选择 3 个。未返场时日历可能暂时为空。</span></p>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const list = document.querySelector('#list');
    const search = document.querySelector('#search');
    const seasonChips = document.querySelector('#seasonChips');
    const selectedChips = document.querySelector('#selectedChips');
    const urlInput = document.querySelector('#url');
    const copyButton = document.querySelector('#copyButton');
    const openButton = document.querySelector('#openButton');
    const count = document.querySelector('#count');
    const hintText = document.querySelector('#hintText');
    const toast = document.querySelector('#toast');
    const selected = new Set();
    let spirits = [];
    let activeSeason = 'all';
    let chipDrag = null;

    function initialSelected() {
      const raw = new URLSearchParams(location.search).get('spirits') || '';
      return raw.split(',').map(name => name.trim()).filter(Boolean).slice(0, 3);
    }

    function spiritName(event) {
      return String(event.title || '')
        .replace(/^【[^】]+】/, '')
        .trim();
    }

    function beijingDate(iso) {
      if (!iso) return '';
      return new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).format(new Date(iso));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function h(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function subscriptionUrl() {
      const names = [...selected];
      if (!names.length) return '';
      const params = new URLSearchParams();
      params.set('spirits', names.join(','));
      return `${location.origin}/spirit-events.ics?${params.toString()}`;
    }

    function webcalUrl(url) {
      return url.replace(/^https?:\/\//, 'webcal://');
    }

    function collectSearchText(...values) {
      const out = [];
      const seen = new Set();
      function walk(value) {
        if (value == null) return;
        if (typeof value === 'string' || typeof value === 'number') {
          const text = String(value).trim();
          if (text && !seen.has(text)) {
            seen.add(text);
            out.push(text);
          }
          return;
        }
        if (Array.isArray(value)) {
          value.forEach(walk);
          return;
        }
        if (typeof value === 'object') {
          Object.values(value).forEach(walk);
        }
      }
      values.forEach(walk);
      return out.join('\n').toLowerCase();
    }

    function renderSelected() {
      if (!selected.size) {
        selectedChips.textContent = '还没有选择先祖。';
        return;
      }
      selectedChips.innerHTML = [...selected].map(name => `
        <button class="selected-chip" type="button" data-name="${h(name)}" aria-label="移除 ${h(name)}">
          ${h(name)}
        </button>
      `).join('');
      selectedChips.querySelectorAll('.selected-chip').forEach(button => {
        button.addEventListener('click', () => {
          selected.delete(button.dataset.name);
          render();
        });
      });
    }

    function renderSeasonChips(seasons) {
      seasonChips.innerHTML = [
        `<button class="chip ${activeSeason === 'all' ? 'is-on' : ''}" type="button" data-season="all">全部</button>`,
        ...seasons.map(season => `<button class="chip ${activeSeason === season ? 'is-on' : ''}" type="button" data-season="${h(season)}">${h(season)}</button>`),
      ].join('');
      seasonChips.querySelectorAll('.chip').forEach(button => {
        button.addEventListener('click', () => {
          if (button.dataset.dragged) return;
          activeSeason = button.dataset.season;
          renderSeasonChips(seasons);
          render();
        });
      });
    }

    seasonChips.addEventListener('pointerdown', event => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      chipDrag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        scrollLeft: seasonChips.scrollLeft,
        moved: false,
      };
      seasonChips.classList.add('is-dragging');
      seasonChips.setPointerCapture(event.pointerId);
    });

    seasonChips.addEventListener('pointermove', event => {
      if (!chipDrag || chipDrag.pointerId !== event.pointerId) return;
      const delta = event.clientX - chipDrag.startX;
      if (Math.abs(delta) > 4) chipDrag.moved = true;
      seasonChips.scrollLeft = chipDrag.scrollLeft - delta;
      if (chipDrag.moved) event.preventDefault();
    });

    function endChipDrag(event) {
      if (!chipDrag || chipDrag.pointerId !== event.pointerId) return;
      seasonChips.classList.remove('is-dragging');
      seasonChips.releasePointerCapture(event.pointerId);
      const moved = chipDrag.moved;
      chipDrag = null;
      if (moved) {
        seasonChips.querySelectorAll('.chip').forEach(button => {
          button.dataset.dragged = '1';
          setTimeout(() => delete button.dataset.dragged, 0);
        });
      }
    }

    seasonChips.addEventListener('pointerup', endChipDrag);
    seasonChips.addEventListener('pointercancel', endChipDrag);

    function updateLink() {
      const url = subscriptionUrl();
      urlInput.value = url;
      count.textContent = `已选 ${selected.size} / 3`;
      copyButton.disabled = !url;
      openButton.href = url ? webcalUrl(url) : '#';
      openButton.setAttribute('aria-disabled', url ? 'false' : 'true');
      if (url) {
        hintText.textContent = [...selected].join('、');
      } else {
        hintText.textContent = '最多选择 3 个。未返场时日历可能暂时为空。';
      }
      renderSelected();
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const visible = spirits.filter(item => {
        if (activeSeason !== 'all' && item.season !== activeSeason) return false;
        return !q || item.searchText.includes(q);
      });
      if (!visible.length) {
        list.innerHTML = '<div class="empty">没有找到符合条件的先祖。</div>';
        updateLink();
        return;
      }
      list.innerHTML = visible.map(item => {
        const on = selected.has(item.name);
        const disabled = !on && selected.size >= 3;
        return `
          <button class="spirit ${on ? 'is-selected' : ''} ${disabled ? 'is-disabled' : ''}" type="button" data-name="${h(item.name)}">
            <span class="mark">✓</span>
            <span>
              <span class="name">${h(item.name)}</span>
              <span class="meta">${h(item.meta)}</span>
            </span>
          </button>`;
      }).join('');
      list.querySelectorAll('.spirit').forEach(button => {
        button.addEventListener('click', () => {
          const name = button.dataset.name;
          if (selected.has(name)) selected.delete(name);
          else if (selected.size < 3) selected.add(name);
          else showToast('最多选择 3 个先祖');
          render();
        });
      });
      updateLink();
    }

    async function load() {
      try {
        const [eventsRes, soulsRes] = await Promise.all([
          fetch('/data/events.json', { cache: 'no-store' }),
          fetch('/data/soul-spirits.json', { cache: 'no-store' }),
        ]);
        if (!eventsRes.ok) throw new Error(`events HTTP ${eventsRes.status}`);
        const events = await eventsRes.json();
        const soulData = soulsRes.ok ? await soulsRes.json() : null;
        const activeMap = new Map((Array.isArray(events) ? events : [])
          .filter(event => event.enabled !== false && event.type === 'traveling_spirit')
          .map(event => [spiritName(event), event]));
        const seen = new Set();
        const source = Array.isArray(soulData?.spirits) && soulData.spirits.length
          ? soulData.spirits.map(item => {
            const active = activeMap.get(item.spiritName);
            const items = Array.isArray(item.items) ? item.items : [];
            return {
              name: item.spiritName,
              season: item.season || '',
              items,
              raw: item,
              active,
              start: active?.start || '',
              end: active?.end || '',
              lastRevisit: item.lastRevisit || '',
              meta: active
                ? `${beijingDate(active.start)} 到来 · ${beijingDate(active.end)} 离开`
                : `${item.season || '未知季节'} · 上次 ${item.lastRevisit || '未知'}`,
            };
          })
          : [...activeMap.values()].map(event => ({
            name: spiritName(event),
            season: '',
            items: [],
            raw: event,
            active: event,
            start: event.start,
            end: event.end,
            lastRevisit: event.start || '',
            meta: `${beijingDate(event.start)} 到来 · ${beijingDate(event.end)} 离开`,
          }));
        spirits = source
          .filter(item => item.name && !seen.has(item.name) && seen.add(item.name))
          .map(item => ({
            ...item,
            searchText: collectSearchText(item.raw, item.active, item.name, item.season, item.lastRevisit, item.items),
        }))
          .sort((a, b) => String(b.lastRevisit || b.start).localeCompare(String(a.lastRevisit || a.start)));
        const seasons = [...new Set(spirits.map(item => item.season).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
        renderSeasonChips(seasons);
        const names = new Set(spirits.map(item => item.name));
        initialSelected().forEach(name => {
          if (names.has(name)) selected.add(name);
        });
        render();
      } catch (err) {
        list.innerHTML = `<div class="empty">读取复刻列表失败：${err.message}</div>`;
      }
    }

    search.addEventListener('input', render);
    copyButton.addEventListener('click', async () => {
      const url = subscriptionUrl();
      if (!url) return;
      try {
        await navigator.clipboard.writeText(url);
        showToast('已复制 HTTPS 订阅链接，请粘贴到日历 App');
      } catch (_) {
        showToast('浏览器不允许自动复制，请长按页面链接手动复制');
      }
    });
    openButton.addEventListener('click', async event => {
      const url = subscriptionUrl();
      if (!url) {
        event.preventDefault();
        return;
      }
      const ua = navigator.userAgent || '';
      const isAppleMobile = /iPhone|iPad|iPod/i.test(ua);
      if (isAppleMobile) return;
      event.preventDefault();
      try {
        await navigator.clipboard.writeText(url);
        showToast('已复制 HTTPS 订阅链接，请粘贴到日历 App');
      } catch (_) {
        showToast('浏览器不允许自动复制，请手动复制链接');
      }
    });

    load();
  </script>
</body>
</html>
