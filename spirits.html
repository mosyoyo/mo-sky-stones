<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sky-ics | 指定先祖订阅</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --card: rgba(255, 255, 255, .86);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(60, 60, 67, .14);
      --blue: #007aff;
      --blue-soft: #e8f2ff;
      --shadow: 0 18px 46px rgba(0, 0, 0, .07);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #fbfbfd 0%, #f5f5f7 58%, #efeff4 100%);
    }
    body.sheet-open {
      overflow: hidden;
    }
    main {
      width: min(760px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 14px 170px;
    }
    .nav {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -18px -14px 0;
      padding: 18px 14px 10px;
      background: #fbfbfd;
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(60, 60, 67, .08);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand {
      color: var(--muted);
      font-size: 13px;
      font-weight: 680;
      letter-spacing: .08em;
    }
    .back {
      color: var(--blue);
      text-decoration: none;
      font-size: 15px;
      font-weight: 650;
    }
    .help-button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--blue);
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
    }
    header {
      padding: 16px 2px 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 56px);
      line-height: 1.04;
      letter-spacing: 0;
      font-weight: 780;
    }
    .lead {
      margin: 10px 0 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      align-items: end;
      background: rgba(0, 0, 0, .28);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }
    .sheet[hidden] {
      display: none;
    }
    .sheet.is-open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-panel {
      width: min(760px, 100%);
      max-height: min(78vh, 720px);
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      padding: 12px 14px 14px;
      border-radius: 24px 24px 0 0;
      background: #f5f5f7;
      box-shadow: 0 -18px 60px rgba(0, 0, 0, .18);
      transform: translateY(18px);
      transition: transform .18s ease;
    }
    .sheet.is-open .sheet-panel {
      transform: translateY(0);
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 12px;
    }
    .sheet-title {
      margin: 0;
      font-size: 18px;
      font-weight: 760;
    }
    .sheet-close {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #e7e7eb;
      color: #3a3a3c;
      font: inherit;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    .sheet-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(150px, .45fr);
      gap: 10px;
      padding-bottom: 10px;
    }
    input[type="search"],
    input[type="text"],
    select {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .86);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-size: 15px;
      outline: none;
    }
    select {
      appearance: none;
      -webkit-appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #6e6e73 50%),
        linear-gradient(135deg, #6e6e73 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 20px,
        calc(100% - 12px) 20px;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 32px;
    }
    input:focus {
      border-color: rgba(0, 122, 255, .42);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, .11);
    }
    .list {
      display: grid;
      gap: 10px;
      overflow: auto;
      padding: 2px 0 14px;
    }
    .spirit {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 72px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
      cursor: pointer;
      text-align: left;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .spirit:active { transform: scale(.99); }
    .spirit.is-selected {
      border-color: rgba(0, 122, 255, .48);
      background: linear-gradient(180deg, #fff 0%, var(--blue-soft) 100%);
    }
    .spirit.is-disabled {
      opacity: .48;
      cursor: default;
    }
    .name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 17px;
      font-weight: 720;
    }
    .meta {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #eef0f3;
      color: transparent;
      font-weight: 800;
      font-size: 14px;
    }
    .is-selected .mark {
      background: var(--blue);
      color: #fff;
    }
    .empty {
      padding: 26px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      color: var(--muted);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .dock {
      position: fixed;
      left: 50%;
      bottom: 14px;
      z-index: 4;
      width: min(760px, calc(100vw - 24px));
      transform: translateX(-50%);
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 22px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .12);
      backdrop-filter: blur(22px);
    }
    .dock-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      align-items: center;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      min-width: 72px;
      border: 0;
      border-radius: 999px;
      padding: 0 16px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .button.secondary {
      background: var(--blue-soft);
      color: #0066cc;
    }
    .button:disabled {
      opacity: .42;
      cursor: default;
    }
    .hint {
      margin: 8px 4px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 104px;
      z-index: 5;
      width: min(360px, calc(100vw - 32px));
      transform: translate(-50%, 12px);
      opacity: 0;
      padding: 11px 14px;
      border-radius: 16px;
      background: rgba(29, 29, 31, .92);
      color: #fff;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    @media (max-width: 560px) {
      main { padding: 10px 10px 176px; }
      .nav { margin: -10px -10px 0; padding: 10px 10px 9px; }
      header { padding-top: 12px; }
      h1 { font-size: 32px; }
      .lead { font-size: 13px; }
      .sheet-panel {
        max-height: 84vh;
        padding: 10px 10px 12px;
        border-radius: 22px 22px 0 0;
      }
      .sheet-controls {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .spirit { min-height: 64px; border-radius: 16px; box-shadow: none; }
      .name { font-size: 16px; }
      .dock { bottom: 10px; border-radius: 20px; }
      .button { width: 100%; height: 38px; min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <nav class="nav">
      <div class="nav-links">
        <a class="back" href="/">返回主页</a>
        <a class="back" href="/subscribe">自定义订阅</a>
      </div>
      <span class="brand">SKY CALENDAR</span>
      <a class="help-button" href="/help" aria-label="使用帮助" title="使用帮助">?</a>
    </nav>

    <header>
      <h1>指定先祖订阅</h1>
      <p class="lead">选择你想单独关注的复刻先祖，生成一个只属于这几个先祖的日历订阅链接。</p>
    </header>

  </main>

  <section class="sheet" id="pickerSheet" aria-hidden="true" aria-label="搜索和筛选先祖" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="sheet-head">
        <h2 class="sheet-title" id="pickerTitle">选择先祖</h2>
        <button id="closePicker" class="sheet-close" type="button" aria-label="关闭">×</button>
      </div>
      <div class="sheet-controls">
        <input id="search" type="search" placeholder="搜索名字、季节、物品" autocomplete="off">
        <select id="seasonFilter" aria-label="按季节筛选">
          <option value="all">全部季节</option>
        </select>
      </div>
      <section class="list" id="list" aria-live="polite"></section>
    </div>
  </section>

  <section class="dock" aria-label="订阅操作">
    <div class="dock-row">
      <button id="subscribeButton" class="button" type="button" disabled>订阅</button>
      <button id="chooseButton" class="button secondary" type="button">选择</button>
    </div>
    <p class="hint"><span id="count">已选 0 / 3</span> · <span id="hintText">最多选择 3 个。未返场时日历可能暂时为空。</span></p>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const list = document.querySelector('#list');
    const search = document.querySelector('#search');
    const seasonFilter = document.querySelector('#seasonFilter');
    const chooseButton = document.querySelector('#chooseButton');
    const closePicker = document.querySelector('#closePicker');
    const pickerSheet = document.querySelector('#pickerSheet');
    const count = document.querySelector('#count');
    const subscribeButton = document.querySelector('#subscribeButton');
    const hintText = document.querySelector('#hintText');
    const toast = document.querySelector('#toast');
    const selected = new Set();
    let spirits = [];

    function initialSelected() {
      const raw = new URLSearchParams(location.search).get('spirits') || '';
      return raw.split(',').map(name => name.trim()).filter(Boolean).slice(0, 3);
    }

    function spiritName(event) {
      return String(event.title || '')
        .replace(/^【[^】]+】/, '')
        .trim();
    }

    function beijingDate(iso) {
      if (!iso) return '';
      return new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        month: 'numeric',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).format(new Date(iso));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function h(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function subscriptionUrl() {
      const names = [...selected];
      if (!names.length) return '';
      const params = new URLSearchParams();
      params.set('spirits', names.join(','));
      return `${location.origin}/spirit-events.ics?${params.toString()}`;
    }

    function webcalUrl(url) {
      return url.replace(/^https?:\/\//, 'webcal://');
    }

    function collectSearchText(...values) {
      const out = [];
      const seen = new Set();
      function walk(value) {
        if (value == null) return;
        if (typeof value === 'string' || typeof value === 'number') {
          const text = String(value).trim();
          if (text && !seen.has(text)) {
            seen.add(text);
            out.push(text);
          }
          return;
        }
        if (Array.isArray(value)) {
          value.forEach(walk);
          return;
        }
        if (typeof value === 'object') {
          Object.values(value).forEach(walk);
        }
      }
      values.forEach(walk);
      return out.join('\n').toLowerCase();
    }

    function openSheet() {
      pickerSheet.hidden = false;
      pickerSheet.classList.add('is-open');
      pickerSheet.setAttribute('aria-hidden', 'false');
      document.body.classList.add('sheet-open');
      setTimeout(() => search.focus(), 120);
    }

    function closeSheet() {
      pickerSheet.classList.remove('is-open');
      pickerSheet.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('sheet-open');
      setTimeout(() => {
        if (!pickerSheet.classList.contains('is-open')) pickerSheet.hidden = true;
      }, 180);
    }

    function updateLink() {
      const url = subscriptionUrl();
      count.textContent = `已选 ${selected.size} / 3`;
      subscribeButton.disabled = !url;
      if (url) {
        hintText.textContent = [...selected].join('、');
      } else {
        hintText.textContent = '最多选择 3 个。未返场时日历可能暂时为空。';
      }
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const season = seasonFilter.value;
      const visible = spirits.filter(item => {
        if (season !== 'all' && item.season !== season) return false;
        return !q || item.searchText.includes(q);
      });
      if (!visible.length) {
        list.innerHTML = '<div class="empty">没有找到符合条件的先祖。</div>';
        updateLink();
        return;
      }
      list.innerHTML = visible.map(item => {
        const on = selected.has(item.name);
        const disabled = !on && selected.size >= 3;
        return `
          <button class="spirit ${on ? 'is-selected' : ''} ${disabled ? 'is-disabled' : ''}" type="button" data-name="${h(item.name)}">
            <span>
              <span class="name">${h(item.name)}</span>
              <span class="meta">${h(item.meta)}</span>
            </span>
            <span class="mark">✓</span>
          </button>`;
      }).join('');
      list.querySelectorAll('.spirit').forEach(button => {
        button.addEventListener('click', () => {
          const name = button.dataset.name;
          if (selected.has(name)) selected.delete(name);
          else if (selected.size < 3) selected.add(name);
          else showToast('最多选择 3 个先祖');
          render();
        });
      });
      updateLink();
    }

    async function load() {
      try {
        const [eventsRes, soulsRes] = await Promise.all([
          fetch('/data/events.json', { cache: 'no-store' }),
          fetch('/data/soul-spirits.json', { cache: 'no-store' }),
        ]);
        if (!eventsRes.ok) throw new Error(`events HTTP ${eventsRes.status}`);
        const events = await eventsRes.json();
        const soulData = soulsRes.ok ? await soulsRes.json() : null;
        const activeMap = new Map((Array.isArray(events) ? events : [])
          .filter(event => event.enabled !== false && event.type === 'traveling_spirit')
          .map(event => [spiritName(event), event]));
        const seen = new Set();
        const source = Array.isArray(soulData?.spirits) && soulData.spirits.length
          ? soulData.spirits.map(item => {
            const active = activeMap.get(item.spiritName);
            const items = Array.isArray(item.items) ? item.items : [];
            return {
              name: item.spiritName,
              season: item.season || '',
              items,
              raw: item,
              active,
              start: active?.start || '',
              end: active?.end || '',
              lastRevisit: item.lastRevisit || '',
              meta: active
                ? `${beijingDate(active.start)} 到来 · ${beijingDate(active.end)} 离开`
                : `${item.season || '未知季节'} · 上次 ${item.lastRevisit || '未知'}`,
            };
          })
          : [...activeMap.values()].map(event => ({
            name: spiritName(event),
            season: '',
            items: [],
            raw: event,
            active: event,
            start: event.start,
            end: event.end,
            lastRevisit: event.start || '',
            meta: `${beijingDate(event.start)} 到来 · ${beijingDate(event.end)} 离开`,
          }));
        spirits = source
          .filter(item => item.name && !seen.has(item.name) && seen.add(item.name))
          .map(item => ({
            ...item,
            searchText: collectSearchText(item.raw, item.active, item.name, item.season, item.lastRevisit, item.items),
          }))
          .sort((a, b) => String(b.lastRevisit || b.start).localeCompare(String(a.lastRevisit || a.start)));
        const seasons = [...new Set(spirits.map(item => item.season).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
        seasonFilter.innerHTML = '<option value="all">全部季节</option>' + seasons.map(season => `<option value="${h(season)}">${h(season)}</option>`).join('');
        const names = new Set(spirits.map(item => item.name));
        initialSelected().forEach(name => {
          if (names.has(name)) selected.add(name);
        });
        render();
      } catch (err) {
        list.innerHTML = `<div class="empty">读取复刻列表失败：${err.message}</div>`;
      }
    }

    search.addEventListener('input', render);
    seasonFilter.addEventListener('change', render);
    chooseButton.addEventListener('click', openSheet);
    closePicker.addEventListener('click', closeSheet);
    pickerSheet.addEventListener('click', event => {
      if (event.target === pickerSheet) closeSheet();
    });
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape' && pickerSheet.classList.contains('is-open')) closeSheet();
    });
    subscribeButton.addEventListener('click', async () => {
      const url = subscriptionUrl();
      if (!url) return;
      const ua = navigator.userAgent || '';
      const isAppleMobile = /iPhone|iPad|iPod/i.test(ua);
      if (isAppleMobile) {
        location.href = webcalUrl(url);
        return;
      }
      try {
        await navigator.clipboard.writeText(url);
        showToast('已复制 HTTPS 订阅链接，请粘贴到日历 App');
      } catch (_) {
        showToast('浏览器不允许自动复制，请长按页面链接手动复制');
      }
    });

    load();
  </script>
</body>
</html>
